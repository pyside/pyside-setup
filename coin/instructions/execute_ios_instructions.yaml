type: Group
instructions:
  - type: ExecuteCommand
    command: ["{{.Env.interpreter}}", "-m", "pip", "install",
              "--user", "--upgrade", "pip>=26.2.2"]
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
         Failed to upgrade pip
  - type: ExecuteCommand
    command: "{{.Env.interpreter}} -m pip install --user -r requirements.txt"
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
         Failed to install deps
  - type: ExecuteCommand
    command: "{{.Env.interpreter}} -m pip install --user -r tools/cross_compile_ios/requirements.txt"
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 1200
    userMessageOnFailure: >
         Failed to install deps
  - type: ExecuteCommand
    command: "{{.Env.interpreter}} tools/cross_compile_ios/main.py --qt-install-path /Users/qt/work/install --arch arm64 --coin"
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 1200
    enable_if:
      condition: and
      conditions:
      - condition: property
        property: target.arch
        equals_value: ARM64
      - condition: runtime
        env_var: TARGET_CONFIGURE_ARGS
        contains_value: "iphoneos"
    userMessageOnFailure: >
         Failed to execute build instructions on arm64-device
  - type: ExecuteCommand
    command: "{{.Env.interpreter}} tools/cross_compile_ios/main.py --qt-install-path /Users/qt/work/install --arch arm64 --simulator --coin"
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 1200
    enable_if:
      condition: and
      conditions:
      - condition: property
        property: target.arch
        equals_value: ARM64
      - condition: runtime
        env_var: TARGET_CONFIGURE_ARGS
        contains_value: "iphonesimulator"
    userMessageOnFailure: >
         Failed to execute build instructions on arm64-simulator
  - type: ExecuteCommand
    command: "{{.Env.interpreter}} tools/cross_compile_ios/main.py --qt-install-path /Users/qt/work/install --arch x86_64 --simulator --coin"
    maxTimeInSeconds: 14400
    maxTimeBetweenOutput: 1200
    enable_if:
      condition: property
      property: target.arch
      equals_value: X86_64
    userMessageOnFailure: >
         Failed to execute build instructions on x86_64-simulator
